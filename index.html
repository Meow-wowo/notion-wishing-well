<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級許願池</title>
  <style>
    :root {
      --bg-color: #f7f9fc;
      --card-reward: #fff0f5;
      --card-bonus: #e6f7ff;
      --card-penalty: #fffbe6;
      --primary-blue: #4a90e2;
      --primary-blue-hover: #357abd;
      --text-color: #333333;
      --text-muted: #666666;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      font-size: 1.8rem;
      color: #2c3e50;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .teacher-zone-btn {
      background: #722ed1;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .teacher-zone-btn:hover {
      background: #531dab;
    }

    .form-container {
      background: white;
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d9d9d9;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--primary-blue);
    }

    .checkbox-group {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-size: 0.9rem;
    }

    .coin-btn {
      width: 100%;
      background-color: var(--primary-blue);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(74, 144, 226, 0.3);
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .coin-btn:hover {
      background-color: var(--primary-blue-hover);
      transform: translateY(-2px);
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 1px solid #d9d9d9;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--primary-blue);
      color: white;
      border-color: var(--primary-blue);
    }

    .wishes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .wish-card {
      padding: 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .wish-card.reward { background-color: var(--card-reward); }
    .wish-card.bonus { background-color: var(--card-bonus); }
    .wish-card.penalty { background-color: var(--card-penalty); }

    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.7);
      margin-bottom: 8px;
      width: fit-content;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .delete-btn {
      background: #ff4d4f;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .wish-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .wish-content {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      padding-top: 8px;
    }

    .like-btn {
      background: white;
      border: 1px solid #ffd6e7;
      padding: 4px 10px;
      border-radius: 15px;
      color: #ff4d4f;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .secret-badge {
      background: #722ed1;
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🪙 班級許願池</h1>
    <button class="teacher-zone-btn" onclick="toggleTeacherMode()">🔒 老師專區</button>
  </header>

  <!-- 許願表單 -->
  <div class="form-container">
    <div class="form-group">
      <label for="category">選擇類別</label>
      <select id="category">
        <option value="reward">🎁 獎勵制度</option>
        <option value="bonus">⭐ 加分制度</option>
        <option value="penalty">⚠️ 扣分制度</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="title">許願主題</label>
      <input type="text" id="title" placeholder="例如：集滿10點換免作業卡、期中考進步獎...">
    </div>

    <div class="form-group">
      <label for="content">詳細內容 / 想對老師說的話</label>
      <textarea id="content" rows="3" placeholder="寫下你的想法或建議..."></textarea>
    </div>

    <div class="form-group checkbox-group">
      <label><input type="checkbox" id="isAnonymous"> 匿名發布</label>
      <label><input type="checkbox" id="isSecret"> 給老師的悄悄話（僅老師可見）</label>
    </div>

    <button class="coin-btn" onclick="addWish()">
      🪙 投幣許願
    </button>
  </div>

  <!-- 分類篩選 -->
  <div class="filters">
    <button class="filter-btn active" onclick="filterWishes('all')">全部</button>
    <button class="filter-btn" onclick="filterWishes('reward')">🎁 獎勵</button>
    <button class="filter-btn" onclick="filterWishes('bonus')">⭐ 加分</button>
    <button class="filter-btn" onclick="filterWishes('penalty')">⚠️ 扣分</button>
  </div>

  <!-- 願望卡片展示區 -->
  <div class="wishes-grid" id="wishesGrid"></div>

  <script>
    let isTeacher = false;
    let currentFilter = 'all';

    // 初始載入資料
    document.addEventListener('DOMContentLoaded', renderWishes);

    function getWishes() {
      return JSON.parse(localStorage.getItem('class_wishes') || '[]');
    }

    function saveWishes(wishes) {
      localStorage.setItem('class_wishes', JSON.stringify(wishes));
    }

    function toggleTeacherMode() {
      if (!isTeacher) {
        const password = prompt('請輸入老師專區密碼：');
        if (password === 'teacher') {
          isTeacher = true;
          alert('已進入老師管理模式！現在可以刪除願望。');
          document.querySelector('.teacher-zone-btn').innerText = '🔓 退出老師專區';
        } else {
          alert('密碼錯誤！');
        }
      } else {
        isTeacher = false;
        alert('已退出老師模式');
        document.querySelector('.teacher-zone-btn').innerText = '🔒 老師專區';
      }
      renderWishes();
    }

    function addWish() {
      const category = document.getElementById('category').value;
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      const isAnonymous = document.getElementById('isAnonymous').checked;
      const isSecret = document.getElementById('isSecret').checked;

      if (!title) {
        alert('請填寫許願主題！');
        return;
      }

      const newWish = {
        id: Date.now(),
        category,
        title,
        content,
        author: isAnonymous ? '匿名同學' : '同學',
        isSecret,
        likes: 0,
        date: new Date().toLocaleDateString()
      };

      const wishes = getWishes();
      wishes.unshift(newWish);
      saveWishes(wishes);

      // 清空表單
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
      document.getElementById('isAnonymous').checked = false;
      document.getElementById('isSecret').checked = false;

      renderWishes();
    }

    function likeWish(id) {
      const wishes = getWishes();
      const wish = wishes.find(w => w.id === id);
      if (wish) {
        wish.likes += 1;
        saveWishes(wishes);
        renderWishes();
      }
    }

    function deleteWish(id) {
      if (!isTeacher) return;
      if (confirm('確定要刪除這條許願嗎？')) {
        let wishes = getWishes();
        wishes = wishes.filter(w => w.id !== id);
        saveWishes(wishes);
        renderWishes();
      }
    }

    function filterWishes(category) {
      currentFilter = category;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderWishes();
    }

    function renderWishes() {
      const wishes = getWishes();
      const grid = document.getElementById('wishesGrid');
      grid.innerHTML = '';

      const filtered = wishes.filter(w => {
        if (w.isSecret && !isTeacher) return false; // 悄悄話僅老師可見
        if (currentFilter === 'all') return true;
        return w.category === currentFilter;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999; padding: 20px;">目前沒有許願資料喔！</p>';
        return;
      }

      filtered.forEach(w => {
        const card = document.createElement('div');
        card.className = `wish-card ${w.category}`;
        
        let categoryText = '🎁 獎勵';
        if (w.category === 'bonus') categoryText = '⭐ 加分';
        if (w.category === 'penalty') categoryText = '⚠️ 扣分';

        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="tag">${categoryText}</span>
              ${w.isSecret ? '<span class="secret-badge">🤫 悄悄話</span>' : ''}
              ${isTeacher ? `<button class="delete-btn" onclick="deleteWish(${w.id})">🗑️ 刪除</button>` : ''}
            </div>
            <div class="wish-title">${escapeHtml(w.title)}</div>
            <div class="wish-content">${escapeHtml(w.content)}</div>
          </div>
          <div class="card-footer">
            <span>${w.author} • ${w.date}</span>
            <button class="like-btn" onclick="likeWish(${w.id})">
              ❤️ <span>${w.likes}</span>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
